; php.ini для PHP 8.x.
;
; Заменяет конфигурацию времён PHP 5.3 (она сохранена как php.ini.legacy): в ней были register_globals,
; session.save_handler = inc, загрузчики ionCube/Zend Guard/eAccelerator/suhosin для PHP 5.3 и т. п. -
; под PHP 8 это либо не работает, либо ломает запуск (PHP 8 не умеет session.save_handler = inc).
;
; Здесь только то, что нужно игре, остальное - значения PHP по умолчанию.
; Если хостинг читает php.ini из корня сайта (CGI/FastCGI) - положите файл как есть. Для php-fpm и mod_php перенесите
; нужные строки в настройки пула/виртуального хоста (или в .user.ini - директивы PHP_INI_PERDIR там не действуют).
;
; Нужные расширения PHP (включает хостинг/пакет PHP, здесь они не подключаются):
;   mysqli   - на нём работает слой mysql_* (inc/mysql_compat.php); расширения mysql в PHP 7+ нет
;   mbstring, iconv, gd (captcha), zlib, ctype, xml (только bonus/votes_bot.php)
; Подробности - в PHP8_MIGRATION.md.

[PHP]
engine = On
short_open_tag = Off
precision = 12
serialize_precision = -1
output_buffering = Off
implicit_flush = Off
zlib.output_compression = On
zlib.output_compression_level = 4

max_execution_time = 30
max_input_time = 60
memory_limit = 128M
post_max_size = 20M

; Предупреждения PHP 8 не должны попадать в страницы: вывод до header()/setcookie()/session_start() ломает
; редиректы, куки и вёрстку. Фатальные ошибки пишутся в лог. Для отладки: LIN2_DEBUG=1 (см. inc/php8.php).
error_reporting = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR | E_USER_ERROR | E_RECOVERABLE_ERROR
display_errors = Off
display_startup_errors = Off
log_errors = On
;error_log = /путь/к/php_errors.log

variables_order = "EGPCS"
allow_url_fopen = On
; в старой конфигурации было On - это дыра (удалённое включение файлов), игре не нужно
allow_url_include = Off

date.timezone = "Europe/Moscow"

[MySQLi]
; Игра подключается к MySQL как «localhost» (через unix-сокет). Если сокет лежит не там, где ожидает PHP, укажите его:
;mysqli.default_socket = /var/run/mysqld/mysqld.sock

[Session]
; старое значение "inc" (нестандартный обработчик сессий старого окружения) в PHP 8 не существует
session.save_handler = files
